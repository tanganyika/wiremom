[project]
name = "wiremom"
version = "0.1.0"
description = "Open-source thin-wire method-of-moments antenna solver (MPIE formulation, Sommerfeld ground)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wiremom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
